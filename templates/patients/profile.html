{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">

<section class="profile-page">

    <div class="profile-card">

        <!-- LEFT PANEL -->
        <div class="profile-left">

            <div class="avatar">
                <i class="fas fa-user"></i>
            </div>

            <h2>Patient Profile</h2>

            <p>
                Complete your personal information before continuing
                to AI heart disease prediction.
            </p>

            <div class="status-box">
                <strong>Profile Status</strong><br>
                Step 1 of 2
            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="profile-right">

            <h2>Personal Information</h2>
            <p>Please fill in your patient details</p>

            <form method="POST">
                {% csrf_token %}

                <!-- Row 1 -->
                <div class="double-input">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text"
                               name="full_name"
                               class="form-control"
                               value="{{ profile.full_name|default:'' }}"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Age</label>
                        <input type="number"
                               name="age"
                               class="form-control"
                               value="{{ profile.age|default:'' }}"
                               required>
                    </div>

                </div>

                <!-- Row 2 -->
                <div class="double-input">

                    <div class="form-group">
                        <label>Gender</label>
                        <select name="gender" class="form-control" required>
                            <option value="">Select Gender</option>
                            <option value="Male"
                                {% if profile.gender == "Male" %}selected{% endif %}>
                                Male
                            </option>
                            <option value="Female"
                                {% if profile.gender == "Female" %}selected{% endif %}>
                                Female
                            </option>
                            <option value="Other"
                                {% if profile.gender == "Other" %}selected{% endif %}>
                                Other
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text"
                               name="phone"
                               class="form-control"
                               value="{{ profile.phone|default:'' }}"
                               placeholder="9876543210"
                               required>
                    </div>

                </div>

                <!-- Row 3 -->
                <div class="double-input">

                    <div class="form-group">
                        <label>Blood Group</label>
                        <select name="blood_group" class="form-control" required>
                            <option value="">Select Blood Group</option>
                            <option value="A+" {% if profile.blood_group == "A+" %}selected{% endif %}>A+</option>
                            <option value="A-" {% if profile.blood_group == "A-" %}selected{% endif %}>A-</option>
                            <option value="B+" {% if profile.blood_group == "B+" %}selected{% endif %}>B+</option>
                            <option value="B-" {% if profile.blood_group == "B-" %}selected{% endif %}>B-</option>
                            <option value="AB+" {% if profile.blood_group == "AB+" %}selected{% endif %}>AB+</option>
                            <option value="AB-" {% if profile.blood_group == "AB-" %}selected{% endif %}>AB-</option>
                            <option value="O+" {% if profile.blood_group == "O+" %}selected{% endif %}>O+</option>
                            <option value="O-" {% if profile.blood_group == "O-" %}selected{% endif %}>O-</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date"
                               name="date_of_birth"
                               class="form-control"
                               value="{{ profile.date_of_birth|date:'Y-m-d' }}"
                               required>
                    </div>

                </div>

                <!-- Address -->
                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address"
                              class="form-control"
                              rows="4"
                              placeholder="Enter your full address"
                              required>{{ profile.address|default:'' }}</textarea>
                </div>

                <!-- Button -->
                <button type="submit" class="save-btn">
                    Save & Continue →
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
