{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/profile.css' %}">

<section class="profile-page">

    <div class="profile-card">

        <!-- LEFT PANEL -->
        <div class="profile-left">

            <div class="avatar">
                <i class="fas fa-heartbeat"></i>
            </div>

            <h2>Health Assessment</h2>

            <p>
                Enter your medical details to predict the risk of
                heart disease using AI.
            </p>

            <div class="status-box">
                <strong>Profile Status</strong><br>
                Step 2 of 2
            </div>

        </div>


        <!-- RIGHT PANEL -->
        <div class="profile-right">

            <h2>Patient Health Form</h2>

            <p>
                Please complete your health details
            </p>


            <!-- HEALTH FORM -->
            <form method="POST">

                {% csrf_token %}

                <div class="double-input">


                    <!-- ========================= -->
                    <!-- HEIGHT -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="height">
                            Height (cm)
                        </label>

                        <input
                            type="number"
                            id="height"
                            name="height"
                            class="form-control"
                            placeholder="170"
                            min="50"
                            max="250"
                            step="0.1"
                            required
                        >

                    </div>


                    <!-- ========================= -->
                    <!-- WEIGHT -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="weight">
                            Weight (kg)
                        </label>

                        <input
                            type="number"
                            id="weight"
                            name="weight"
                            class="form-control"
                            placeholder="65"
                            min="20"
                            max="300"
                            step="0.1"
                            required
                        >

                    </div>


                    <!-- ========================= -->
                    <!-- BLOOD PRESSURE -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="blood_pressure">
                            Blood Pressure
                        </label>

                        <input
                            type="text"
                            id="blood_pressure"
                            name="blood_pressure"
                            placeholder="120/80"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- ========================= -->
                    <!-- CHOLESTEROL -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="cholesterol">
                            Cholesterol (mg/dL)
                        </label>

                        <input
                            type="number"
                            id="cholesterol"
                            name="cholesterol"
                            class="form-control"
                            placeholder="170"
                            min="50"
                            max="500"
                            step="0.1"
                            required
                        >

                    </div>


                    <!-- ========================= -->
                    <!-- HEART RATE -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="heart_rate">
                            Heart Rate (BPM)
                        </label>

                        <input
                            type="number"
                            id="heart_rate"
                            name="heart_rate"
                            class="form-control"
                            placeholder="72"
                            min="30"
                            max="250"
                            required
                        >

                    </div>


                    <!-- ========================= -->
                    <!-- BLOOD SUGAR -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="blood_sugar">
                            Blood Sugar (mg/dL)
                        </label>

                        <input
                            type="number"
                            id="blood_sugar"
                            name="blood_sugar"
                            class="form-control"
                            placeholder="90"
                            min="40"
                            max="500"
                            step="0.1"
                            required
                        >

                    </div>


                    <!-- ========================= -->
                    <!-- HEMOGLOBIN -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="hb">
                            Hemoglobin (Hb g/dL)
                        </label>

                        <input
                            type="number"
                            id="hb"
                            name="hb"
                            class="form-control"
                            placeholder="14.2"
                            min="5"
                            max="25"
                            step="0.1"
                            required
                        >

                    </div>


                    <!-- ========================= -->
                    <!-- HBA1C -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="hba1c">
                            HbA1c (%)
                        </label>

                        <input
                            type="number"
                            id="hba1c"
                            name="hba1c"
                            class="form-control"
                            placeholder="5.8"
                            min="3"
                            max="20"
                            step="0.1"
                            required
                        >

                    </div>


                    <!-- ========================= -->
                    <!-- ECG RESULT -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="ecg">
                            ECG Result
                        </label>

                        <select
                            id="ecg"
                            name="ecg"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Select ECG
                            </option>

                            <option value="Normal">
                                Normal
                            </option>

                            <option value="ST-T Abnormality">
                                ST-T Abnormality
                            </option>

                            <option value="Left Ventricular Hypertrophy">
                                Left Ventricular Hypertrophy
                            </option>

                        </select>

                    </div>


                    <!-- ========================= -->
                    <!-- CHEST PAIN -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="chest_pain">
                            Chest Pain Type
                        </label>

                        <select
                            id="chest_pain"
                            name="chest_pain"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Select Type
                            </option>

                            <option value="No Chest Pain">
                                No Chest Pain
                            </option>

                            <option value="Mild">
                                Mild
                            </option>

                            <option value="Moderate">
                                Moderate
                            </option>

                            <option value="Severe">
                                Severe
                            </option>

                        </select>

                    </div>


                    <!-- ========================= -->
                    <!-- SMOKING -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="smoking">
                            Smoking
                        </label>

                        <select
                            id="smoking"
                            name="smoking"
                            class="form-control"
                            required
                        >

                            <option value="No">
                                No
                            </option>

                            <option value="Yes">
                                Yes
                            </option>

                        </select>

                    </div>


                    <!-- ========================= -->
                    <!-- DIABETES -->
                    <!-- ========================= -->

                    <div class="form-group">

                        <label for="diabetes">
                            Diabetes
                        </label>

                        <select
                            id="diabetes"
                            name="diabetes"
                            class="form-control"
                            required
                        >

                            <option value="No">
                                No
                            </option>

                            <option value="Yes">
                                Yes
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ========================= -->
                <!-- SUBMIT BUTTON -->
                <!-- ========================= -->

                <button
                    type="submit"
                    class="save-btn"
                >
                    Continue to Prediction →
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
